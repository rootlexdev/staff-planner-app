<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Staff Shift Planner</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<h1>Staff Shift Planner</h1>

<h2>Add Staff</h2>
<form id="staff-form">
  <input type="text" id="staff-name" placeholder="Name" required>
  <input type="text" id="staff-role" placeholder="Role (e.g. Cashier)" required>
  <button type="submit">Add</button>
</form>

<h2>Staff List</h2>
<ul id="staff-list"></ul>

<script src="script.js"></script>
</body>
</html>
